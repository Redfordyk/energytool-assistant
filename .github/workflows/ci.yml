name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: energytool
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: energytool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U energytool -d energytool"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://energytool:testpassword@localhost:5432/energytool
      TEST_DATABASE_URL: postgresql+psycopg://energytool:testpassword@localhost:5432/energytool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: alembic upgrade head
      - run: pytest -q
        env:
          RUN_E2E: '1'
      - run: docker build -t energytool .
