<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energytool — консультант</title><style>
body{font:16px system-ui;background:#f4f4f6;color:#17171a;margin:0}main{max-width:760px;margin:3rem auto;padding:0 1rem}h1{font-size:2rem}button{background:#e30613;color:white;border:0;border-radius:8px;padding:.75rem 1rem;cursor:pointer}input,textarea{box-sizing:border-box;width:100%;padding:.8rem;border:1px solid #bbb;border-radius:8px;font:inherit}textarea{resize:vertical}section,form{background:white;border-radius:14px;padding:1.2rem;margin:1rem 0}#messages{min-height:12rem;white-space:pre-wrap}.user{font-weight:600}.assistant{color:#444}label{display:block;margin:.7rem 0}label.check{display:flex;gap:.5rem}label.check input{width:auto}#status{color:#555}
</style></head><body><main><h1>Energytool</h1><p>Консультант по энергетическим решениям</p><button id="new">Новый диалог</button><section id="messages" aria-live="polite"></section><form id="chat"><label for="question">Ваш вопрос</label><textarea id="question" required maxlength="4000" rows="3"></textarea><p><button>Отправить</button></p></form><section><h2>Заявка специалисту</h2><p>Для демонстрации используйте вымышленные контакты. Заявка сохраняется локально и никуда не отправляется.</p><form id="lead"><label>ФИО<input id="name" required minlength="2" maxlength="120"></label><label>Телефон<input id="phone" required type="tel" maxlength="30"></label><label>Компания<input id="company" required minlength="2" maxlength="160"></label><label class="check"><input id="consent" type="checkbox" required> Подтверждаю сохранение указанных контактов</label><button>Сохранить заявку</button></form><p id="status" role="status"></p></section></main><script>
let session=JSON.parse(sessionStorage.getItem('session')||'null'), requestKey=crypto.randomUUID();
const messages=document.querySelector('#messages'), status=document.querySelector('#status');
async function start(){let r=await fetch('/api/sessions',{method:'POST'});if(!r.ok)throw Error();session=await r.json();sessionStorage.setItem('session',JSON.stringify(session));messages.replaceChildren();requestKey=crypto.randomUUID()}
function add(role,text){let p=document.createElement('p');p.className=role;p.textContent=(role==='user'?'Вы: ':'Консультант: ')+text;messages.append(p)}
async function api(path,body){let r=await fetch('/api/sessions/'+session.id+path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.token},body:JSON.stringify(body)});if(!r.ok)throw Error('Не удалось выполнить запрос. Проверьте данные и повторите.');return r.json()}
document.querySelector('#new').onclick=()=>start().catch(()=>status.textContent='Не удалось создать диалог');
document.querySelector('#chat').onsubmit=async e=>{e.preventDefault();let input=document.querySelector('#question'),text=input.value.trim();if(!text)return;let b=e.submitter;b.disabled=true;try{if(!session)await start();add('user',text);input.value='';let r=await api('/messages',{text});add('assistant',r.answer)}catch(err){status.textContent=err.message}finally{b.disabled=false}};
document.querySelector('#lead').onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;try{if(!session)await start();await api('/leads',{name:document.querySelector('#name').value,phone:document.querySelector('#phone').value,company:document.querySelector('#company').value,consent:document.querySelector('#consent').checked,request_key:requestKey});status.textContent='Заявка сохранена.'}catch(err){status.textContent=err.message}finally{b.disabled=false}};
if(session)fetch('/api/sessions/'+session.id+'/messages',{headers:{Authorization:'Bearer '+session.token}}).then(r=>r.ok?r.json():[]).then(rows=>rows.forEach(m=>add(m.role,m.content))).catch(()=>{});
</script></body></html>
