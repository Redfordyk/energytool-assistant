<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energytool — консультант</title>
<style>body{font:16px system-ui;background:#f4f4f6;color:#17171a;margin:0}main{max-width:760px;margin:3rem auto;padding:0 1rem}h1{font-size:2rem}button{background:#c90012;color:white;border:0;border-radius:8px;padding:.75rem 1rem;cursor:pointer}button:disabled{opacity:.5}input,textarea{box-sizing:border-box;width:100%;padding:.8rem;border:1px solid #bbb;border-radius:8px;font:inherit}textarea{resize:vertical}section,form{background:white;border-radius:14px;padding:1.2rem;margin:1rem 0}#messages{min-height:12rem;white-space:pre-wrap}.user{font-weight:600}.assistant{color:#444}label{display:block;margin:.7rem 0}label.check{display:flex;gap:.5rem}label.check input{width:auto}#status{color:#555}#preview-text{white-space:pre-wrap}</style></head>
<body><main><h1>Energytool</h1><p>Консультант по энергетическим решениям</p><button id="new">Новый диалог</button><section id="messages" aria-live="polite"></section><form id="chat"><label for="question">Ваш вопрос</label><textarea id="question" required maxlength="4000" rows="3"></textarea><p><button>Отправить</button></p></form><section><h2>Заявка специалисту</h2><p>Для демонстрации используйте вымышленные контакты. Заявка сохраняется локально и никуда не отправляется.</p><form id="lead"><label>ФИО<input id="name" required minlength="2" maxlength="120"></label><label>Телефон<input id="phone" required type="tel" maxlength="30"></label><label>Компания<input id="company" required minlength="2" maxlength="160"></label><button>Проверить заявку</button></form><div id="preview" hidden><h3>Проверьте данные</h3><p id="preview-text"></p><label class="check"><input id="consent" type="checkbox"> Подтверждаю сохранение показанных данных</label><button id="confirm">Сохранить заявку</button><button id="cancel" type="button">Отменить</button></div><p id="status" role="status"></p></section></main>
<script>
let session=JSON.parse(sessionStorage.getItem('session')||'null'),requestKey=crypto.randomUUID(),confirmation=null,busy=false;
const messages=document.querySelector('#messages'),status=document.querySelector('#status'),preview=document.querySelector('#preview'),leadForm=document.querySelector('#lead');
function clearPreview(){confirmation=null;preview.hidden=true;document.querySelector('#consent').checked=false}
async function start(resetForm=true){const r=await fetch('/api/sessions',{method:'POST'});if(!r.ok)throw Error('Не удалось создать диалог');session=await r.json();sessionStorage.setItem('session',JSON.stringify(session));messages.replaceChildren();requestKey=crypto.randomUUID();clearPreview();if(resetForm)leadForm.reset()}
function add(role,text){const p=document.createElement('p');p.className=role;p.textContent=(role==='user'?'Вы: ':'Консультант: ')+text;messages.append(p)}
async function api(path,body,withKey=false){const headers={'Content-Type':'application/json','Authorization':'Bearer '+session.token};if(withKey)headers['Idempotency-Key']=requestKey;const r=await fetch('/api/sessions/'+session.id+path,{method:'POST',headers,body:JSON.stringify(body)});if(!r.ok){const data=await r.json().catch(()=>({}));throw Error(typeof data.detail==='string'?data.detail:'Не удалось выполнить запрос. Проверьте данные и повторите.')}return r.json()}
async function run(action){if(busy)return;busy=true;try{await action()}catch(err){status.textContent=err.message||'Произошла ошибка'}finally{busy=false}}
document.querySelector('#new').onclick=()=>run(start);
document.querySelector('#chat').onsubmit=e=>{e.preventDefault();run(async()=>{const input=document.querySelector('#question'),text=input.value.trim();if(!text)return;if(!session)await start();const r=await api('/messages',{text});add('user',text);add('assistant',r.answer);input.value='';clearPreview()})};
leadForm.addEventListener('input',clearPreview);
leadForm.onsubmit=e=>{e.preventDefault();run(async()=>{const fields={name:document.querySelector('#name').value,phone:document.querySelector('#phone').value,company:document.querySelector('#company').value};if(!session)await start(false);const draft=await api('/lead-drafts',fields,true);confirmation=draft.confirmation_token;document.querySelector('#preview-text').textContent='ФИО: '+draft.name+'\nТелефон: '+draft.phone+'\nКомпания: '+draft.company+'\nКонтекст задачи:\n'+draft.summary;preview.hidden=false;status.textContent=''})};
document.querySelector('#cancel').onclick=()=>run(async()=>{const r=await fetch('/api/sessions/'+session.id+'/lead-drafts',{method:'DELETE',headers:{Authorization:'Bearer '+session.token,'Idempotency-Key':requestKey}});if(!r.ok)throw Error('Не удалось отменить заявку');clearPreview();status.textContent='Заявка отменена.'});
document.querySelector('#confirm').onclick=()=>run(async()=>{if(!confirmation||!document.querySelector('#consent').checked)throw Error('Подтвердите сохранение показанных данных');await api('/leads',{confirmation_token:confirmation,consent:true},true);status.textContent='Заявка сохранена.';clearPreview();leadForm.reset();requestKey=crypto.randomUUID()});
if(session)fetch('/api/sessions/'+session.id+'/messages',{headers:{Authorization:'Bearer '+session.token}}).then(r=>r.ok?r.json():[]).then(rows=>rows.forEach(m=>add(m.role,m.content))).catch(()=>{});
</script></body></html>
