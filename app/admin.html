<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Управление базой знаний</title>
<style>body{font:16px system-ui;background:#f4f4f6;color:#17171a;margin:0}main{max-width:760px;margin:3rem auto;padding:0 1rem}section{background:white;border-radius:14px;padding:1.2rem;margin:1rem 0}input{box-sizing:border-box;width:100%;padding:.8rem;border:1px solid #bbb;border-radius:8px;font:inherit}button{background:#c80012;color:white;border:0;border-radius:8px;padding:.7rem 1rem;cursor:pointer;margin:.3rem .3rem .3rem 0}button:disabled{opacity:.5}code{overflow-wrap:anywhere}a{color:#a50012}</style></head>
<body><main><a href="/">← Вернуться в чат</a><h1>База знаний</h1><p>Зарегистрируйте архив из каталога data, проверьте его содержимое и только после этого утвердите и активируйте версию.</p><section><label for="token">Токен администратора или проверяющего</label><input id="token" type="password" autocomplete="off"><p><button id="load">Открыть реестр</button><button id="register">Зарегистрировать архив</button></p><p id="status" role="status"></p></section><section><h2>Версии</h2><div id="versions"></div></section></main>
<script>
const token=document.querySelector('#token'),status=document.querySelector('#status'),versions=document.querySelector('#versions');
async function call(path,method='GET'){const response=await fetch('/api/admin/knowledge'+path,{method,headers:{Authorization:'Bearer '+token.value}});if(!response.ok){const data=await response.json().catch(()=>({}));throw new Error(data.detail||'Ошибка запроса')}return response.json()}
async function refresh(){const rows=await call('');versions.replaceChildren();if(!rows.length)versions.textContent='Версий пока нет.';for(const row of rows){const item=document.createElement('article'),title=document.createElement('p'),hash=document.createElement('code');hash.textContent=row.sha256;title.append(hash,document.createTextNode(' — '+row.status));item.append(title);for(const action of ['approve','activate','revoke']){const button=document.createElement('button');button.textContent={approve:'Утвердить',activate:'Активировать',revoke:'Отозвать'}[action];button.onclick=async()=>{button.disabled=true;try{await call('/'+row.sha256+'/'+action,'POST');status.textContent='Действие выполнено';await refresh()}catch(e){status.textContent=e.message}finally{button.disabled=false}};item.append(button)}versions.append(item)}}
document.querySelector('#load').onclick=()=>refresh().catch(e=>status.textContent=e.message);
document.querySelector('#register').onclick=async()=>{try{await call('/register','POST');status.textContent='Архив зарегистрирован';await refresh()}catch(e){status.textContent=e.message}};
</script></body></html>
