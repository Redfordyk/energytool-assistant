services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: energytool
      POSTGRES_USER: energytool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energytool -d energytool"]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
      - knowledge-data:/knowledge
    environment:
      DATA_DIR: /app/data
      KNOWLEDGE_DIR: /knowledge
      DATABASE_URL: postgresql+psycopg://energytool:${POSTGRES_PASSWORD}@db:5432/energytool
volumes:
  postgres-data:
  knowledge-data:
